<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personality Analyzer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">

    <header>
        <h1>Personality Analyzer</h1>
    </header>

    <div class="card">
        <textarea 
            id="inputText" 
            placeholder="Enter text to analyze..."
        ></textarea>

        <div class="buttons">
            <button onclick="analyzeText()">Analyze</button>
            <button class="secondary" onclick="resetForm()">Reset</button>
        </div>

        <div id="loading" class="hidden">
            Analyzing...
        </div>
    </div>

    <!-- PRIMARY OUTPUT -->
    <div id="primaryResult" class="card hidden">
        <h2> Final Personality Prediction (XGBoost)</h2>
        <canvas id="radarChart"></canvas>
        <div id="primaryTraits"></div>
    </div>

    <!-- OTHER MODELS -->
    <div id="comparisonSection" class="card hidden">
        <h2>📊 Model Comparison</h2>
        <div id="otherModels"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
